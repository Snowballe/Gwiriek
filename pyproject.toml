[project]
name = "gwiriek"
version = "0.1.0"
description = "Free, self-hosted PPE management for small rope access companies."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Snowballe" }]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django>=6.1,<6.2",
    "django-stubs-ext>=6.1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
gwiriek = "gwiriek.cli:main"

[project.urls]
Repository = "https://github.com/Snowballe/gwiriek"

[dependency-groups]
dev = [
    "django-stubs>=6.1",
    "mypy>=2.4",
    "pydoclint>=0.12",
    "pytest>=9.2",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gwiriek"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gwiriek.settings"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["gwiriek/equipment/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF", "PT", "C4", "PIE", "RET", "D"]
ignore = ["D100", "D104", "D105", "D106", "D107", "RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["gwiriek/equipment/migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "gwiriek.settings"

[tool.pydoclint]
style = "google"
exclude = "migrations|tests"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = true
skip-checking-raises = true
