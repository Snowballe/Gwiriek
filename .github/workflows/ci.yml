---
name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: "read"

jobs:
  checks:
    name: "Lint, type-check and test (Python ${{ matrix.python-version }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v10.3.3"
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install gettext"
        run: "sudo apt-get update && sudo apt-get install --yes gettext"

      - name: "Install dependencies"
        run: "uv sync --locked"

      - name: "Lint"
        run: "uv run ruff check ."

      - name: "Check formatting"
        run: "uv run ruff format --check ."

      - name: "Type-check"
        run: "uv run mypy ."

      - name: "Check docstrings"
        run: "uv run pydoclint gwiriek"

      - name: "Run Django system checks"
        run: "uv run python manage.py check"

      - name: "Check for missing migrations"
        run: "uv run python manage.py makemigrations --check --dry-run"

      - name: "Check French translations are complete"
        working-directory: "gwiriek"
        run: >-
          uv run django-admin makemessages -l fr --no-location --settings=gwiriek.settings
          && test -z "$(msgattrib --untranslated --no-obsolete locale/fr/LC_MESSAGES/django.po)"
          && test -z "$(msgattrib --only-fuzzy --no-obsolete locale/fr/LC_MESSAGES/django.po)"
          && uv run django-admin compilemessages --settings=gwiriek.settings

      - name: "Run tests"
        run: "uv run pytest"
